[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "patient-triage-ai-cdm"
version = "0.3.0"
description = "Synthetic district-ED coordination prototype using a safety-constrained context-dependent model"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
authors = [{name = "Team ETINIMTSAL"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Healthcare Industry",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "fastapi==0.141.1",
  "httpx2==2.12.0",
  "numpy==2.5.2",
  "pandas==3.0.5",
  "plotly==6.9.0",
  "pydantic==2.13.4",
  "streamlit==1.62.0",
  "uvicorn[standard]==0.52.4",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.4",
]

[project.scripts]
patient-triage-api = "patient_triage.api.app:run"
patient-triage-demo = "patient_triage.simulations.run_demo:main"
patient-triage-reports = "patient_triage.simulations.generate_reports:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers --cov=patient_triage --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]
filterwarnings = [
  "error::DeprecationWarning:patient_triage.*",
]

[tool.coverage.run]
branch = true
source = ["patient_triage"]

[tool.coverage.report]
exclude_also = [
  "if __name__ == .__main__.:",
  'def run\(\) -> None:',
]
show_missing = true

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
